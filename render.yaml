databases:
  - name: royaldryfruits-db
    databaseName: royaldryfruits
    user: postgres
    plan: free

services:
  - type: web
    name: royaldryfruits-api
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: royaldryfruits-db
          property: connectionString

  - type: web
    name: royaldryfruits-storefront
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend/royaldryfruits-app && npm install && npm run build
    staticPublishPath: frontend/royaldryfruits-app/dist
    envVars:
      - key: VITE_API_URL
        value: https://royaldryfruits-api.onrender.com/api

  - type: web
    name: royaldryfruits-admin
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend/admin-portal && npm install && npm run build
    staticPublishPath: frontend/admin-portal/dist
    envVars:
      - key: VITE_API_URL
        value: https://royaldryfruits-api.onrender.com/api
